[project]
name = "alberton-mcp"
version = "0.1.0"
description = "MCP server for Ableton Live, via the Alberton Remote Script bridge"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # 2.0 removed mcp.server.fastmcp; stay on 1.x until we migrate deliberately.
    "mcp[cli]>=1.2,<2",
]

[project.scripts]
alberton-mcp = "alberton_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alberton_mcp"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
